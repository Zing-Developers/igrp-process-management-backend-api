# General
spring.config.import=optional:file:.env[.properties]
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
# V6 builds indexes with CREATE INDEX CONCURRENTLY, which cannot run inside a transaction.
# Flyway's default PostgreSQL lock is transaction-scoped and would hold an open transaction
# around the migration; switch to a session-level lock so the concurrent build succeeds.
# (Note: if connecting through PgBouncer in transaction-pooling mode, run migrations on a
# direct connection.) The per-script V6__*.sql.conf disables the migration's own transaction.
spring.flyway.postgresql.transactional-lock=false

spring.application.name=igrp-platform-process-management

# Default profile
# Production-safe default: development (ddl-auto=update, show-sql) must be an explicit choice
spring.profiles.active=${SPRING_ACTIVE_PROFILE:production}

server.shutdown=graceful

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus


spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

igrp.mail.default.from=${IGRP_MAIL_DEFAULT_FROM:no-reply@igrp.cv}

spring.activiti.history-level=full
spring.activiti.db-history-used=true

# Kafka
# === Basic connection ===
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=igrp-process


# === Serialization / Deserialization (safe defaults) ===
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# === Optional SASL Authentication (only applies if username/password provided) ===
spring.kafka.properties.sasl.mechanism=${SPRING_KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.security.protocol=${SPRING_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

# Username and password for SASL (leave empty if unauthenticated)
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
     username="${SPRING_KAFKA_USERNAME}" \
     password="${SPRING_KAFKA_PASSWORD}";

# Example for SASL (only used when username/password provided)
# spring.kafka.properties.security.protocol=SASL_PLAINTEXT
# spring.kafka.properties.sasl.mechanism=PLAIN
# spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
#     username="your-username" \
#     password="your-password";

# === Other consumer tuning (optional) ===
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

# No default: a deployment that does not set the token sends no shared secret anywhere
igrp.delegate.webhook.auth-token=${IGRP_DELEGATE_WEBHOOK_AUTH_TOKEN:}

igrp.message.broker.provider=${IGRP_MESSAGE_BROKER_PROVIDER:none}

igrp.authorization.service.adapter=${IGRP_AUTHORIZATION_SERVICE_ADAPTER:default}

# Outbound SSRF policy for delegate calls whose destination comes from process variables
# (webhooks, external assignment). Private/loopback/link-local/CGNAT ranges are always blocked
# unless the host is explicitly allowlisted; https is required outside development.
igrp.delegate.outbound.require-https=${IGRP_OUTBOUND_REQUIRE_HTTPS:true}
igrp.delegate.outbound.allowed-hosts=${IGRP_OUTBOUND_ALLOWED_HOSTS:}
igrp.delegate.outbound.allowed-extra-headers=${IGRP_OUTBOUND_ALLOWED_EXTRA_HEADERS:}
igrp.delegate.outbound.max-response-bytes=${IGRP_OUTBOUND_MAX_RESPONSE_BYTES:1048576}
# Which server env vars a process definition may reference via $[VAR] (exact names or PREFIX*).
# Governs ALL delegate env-var resolution; stops a process exfiltrating e.g. $[POSTGRES_PASSWORD].
igrp.delegate.outbound.allowed-env-vars=${IGRP_OUTBOUND_ALLOWED_ENV_VARS:IGRP_WEBHOOK_*}

# Outbound HTTP client (webhooks, external assignment) timeouts — previously infinite.
# Honored by both the app fallback RestClient and the framework signed-auth RestClient.
igrp.restclient.connect-timeout=${IGRP_RESTCLIENT_CONNECT_TIMEOUT:5s}
igrp.restclient.read-timeout=${IGRP_RESTCLIENT_READ_TIMEOUT:10s}

igrp.security.principal-claim-name=${IGRP_SECURITY_PRINCIPAL_CLAIM_NAME:sub}

# Comma-separated browser origins for CORS; empty disables cross-origin access entirely
igrp.cors.allowed-origins=${IGRP_CORS_ALLOWED_ORIGINS:}

# IRN identity provider (read by process-runtime-auth-irn when the adapter above is 'irn')
irn.api.base-url=${IRN_API_BASE_URL:}
irn.api.super-admin-email=${IRN_API_SUPER_ADMIN_EMAIL:}
irn.api.session-cookie-name=${IRN_API_SESSION_COOKIE_NAME:session_id}

# Route authorization. Permissions are MODULE:action and are derived from the HTTP method
# (GET=visualizar, POST=criar, PUT/PATCH=editar, DELETE=eliminar); overrides cover the routes that
# escape that rule. Modules are matched in declaration order.
# Catalogue and rationale: docs/SPEC_ROUTE_AUTHORIZATION.md
irn.authorization.routes.deny-unmatched=${IRN_AUTHORIZATION_DENY_UNMATCHED:true}

irn.authorization.routes.modules[0].code=AREAS
irn.authorization.routes.modules[0].pattern=/areas
# accept-also: if IRN frontends also front /areas with their own codes, list them per tier and uncomment.
# Any-of, alongside the derived AREAS:<action>. Fill from System Administration (no rebuild needed).
irn.authorization.routes.modules[0].accept-also.visualizar=${IRN_AREAS_ACCEPT_READ:}
irn.authorization.routes.modules[0].accept-also.criar=${IRN_AREAS_ACCEPT_WRITE:}
irn.authorization.routes.modules[0].accept-also.editar=${IRN_AREAS_ACCEPT_EDIT:}
irn.authorization.routes.modules[0].accept-also.eliminar=${IRN_AREAS_ACCEPT_DELETE:}

irn.authorization.routes.modules[1].code=PROCESS_DEFINITIONS
irn.authorization.routes.modules[1].pattern=/process-definitions
# Deploying publishes executable BPMN: its own action, not shared with :criar
irn.authorization.routes.modules[1].overrides[0].method=POST
irn.authorization.routes.modules[1].overrides[0].path=/deploy
irn.authorization.routes.modules[1].overrides[0].action=publicar
# accept-also candidates: PROCESS_MAP, PROCESS_CONFIGURATION, CONFIGURADOR_PROCESSOS (confirm which
# front /process-definitions and with which verbs). Keyed by action; :publicar has its own tier.
irn.authorization.routes.modules[1].accept-also.visualizar=${IRN_PROCDEF_ACCEPT_READ:}
irn.authorization.routes.modules[1].accept-also.criar=${IRN_PROCDEF_ACCEPT_WRITE:}
irn.authorization.routes.modules[1].accept-also.editar=${IRN_PROCDEF_ACCEPT_EDIT:}
irn.authorization.routes.modules[1].accept-also.eliminar=${IRN_PROCDEF_ACCEPT_DELETE:}
irn.authorization.routes.modules[1].accept-also.publicar=${IRN_PROCDEF_ACCEPT_PUBLISH:}

irn.authorization.routes.modules[2].code=PROCESS_INSTANCES
irn.authorization.routes.modules[2].pattern=/process-instances
# Search takes its filter in the body, so it is a POST that reads
irn.authorization.routes.modules[2].overrides[0].method=POST
irn.authorization.routes.modules[2].overrides[0].path=/search
irn.authorization.routes.modules[2].overrides[0].action=visualizar
# accept-also candidates: FILA_TRABALHO, PROCESS_MAP (confirm). :visualizar is inherited by the search override.
irn.authorization.routes.modules[2].accept-also.visualizar=${IRN_PROCINST_ACCEPT_READ:}
irn.authorization.routes.modules[2].accept-also.criar=${IRN_PROCINST_ACCEPT_WRITE:}

irn.authorization.routes.modules[3].code=ACTIVITIES
irn.authorization.routes.modules[3].pattern=/activities
# accept-also: only a read tier exists on /activities.
irn.authorization.routes.modules[3].accept-also.visualizar=${IRN_ACTIVITIES_ACCEPT_READ:}

irn.authorization.routes.modules[4].code=TASK_INSTANCES
irn.authorization.routes.modules[4].pattern=/tasks-instances
irn.authorization.routes.modules[4].overrides[0].method=POST
irn.authorization.routes.modules[4].overrides[0].path=/search
irn.authorization.routes.modules[4].overrides[0].action=visualizar
irn.authorization.routes.modules[4].overrides[1].method=POST
irn.authorization.routes.modules[4].overrides[1].path=/me
irn.authorization.routes.modules[4].overrides[1].action=visualizar

# The tasks endpoints are fronted by several IRN modules (Fila de Trabalho, Gestão de Tarefas,
# Minhas Tarefas, Tarefas Disponíveis), each with its own permission code and verb. accept-also lets
# a user of ANY of them through, alongside our derived TASK_INSTANCES:<action>. Verbs marked TODO are
# placeholders — replace with the real System Administration codes (no rebuild needed).
# Confirmed from /Auth/me: TASK_MANAGEMENT:ver.
irn.authorization.routes.modules[4].accept-also.visualizar=${IRN_TASKS_ACCEPT_READ:FILA_TRABALHO:visualizar,TASK_MANAGEMENT:ver,MY_TASKS:visualizar,AVAILABLE_TASKS:visualizar}
irn.authorization.routes.modules[4].accept-also.criar=${IRN_TASKS_ACCEPT_WRITE:}
irn.authorization.routes.modules[4].accept-also.editar=${IRN_TASKS_ACCEPT_EDIT:}
irn.authorization.routes.modules[4].accept-also.eliminar=${IRN_TASKS_ACCEPT_DELETE:}

# Permissions that grant "see all tasks" (any-of). Populate with the real IRN supervision codes.
igrp.authorization.task-search-all-permissions=${IGRP_TASK_SEARCH_ALL_PERMISSIONS:TASK_INSTANCES:pesquisar_todos}

# Observability
otel.resource.attributes.service.name=${spring.application.name}
otel.resource.attributes.deployment.environment=${spring.profiles.active}
otel.logs.exporter=otlp
otel.metrics.exporter=otlp
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=${OTEL_COLLECTOR_ENDPOINT}
otel.sdk.disabled=${OTEL_DISABLED:true}
# Ship SLF4J key-value pairs (security audit events) and MDC entries as OTLP log attributes
otel.instrumentation.logback-appender.experimental.capture-key-value-pair-attributes=true
otel.instrumentation.logback-appender.experimental.capture-mdc-attributes=*
otel.instrumentation.logback-appender.experimental-log-attributes=true

# Enable debug logging for the package
logging.level.cv.igrp.framework.runtime.activiti.engine.task=DEBUG

spring.cache.type=caffeine
# Customize caches
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=5m

# Entity Revision
# Track entity names modified during a revision
spring.jpa.properties.org.hibernate.envers.track_entities_changed_in_revision=true
# Enable withModifiedFlag globally
spring.jpa.properties.org.hibernate.envers.global_with_modified_flag=true
# Set schema and catalog for audit tables
#spring.jpa.properties.org.hibernate.envers.default_schema=audit_schema
