# Standard build-and-push pipeline for any Zing app repo.
#
# Como usar num repo novo:
#   1. Copiar este ficheiro tal e qual para <repo>/.github/workflows/build.yml
#   2. Preencher APENAS as duas variáveis no bloco "CONFIGURAR POR REPO" logo
#      abaixo (HELM_VALUES_FILE e HELM_CHART_COMPONENT) — nada mais no
#      ficheiro precisa de ser tocado.
#
# Required repo secrets:
#   NEXUS_USER, NEXUS_PASSWORD — credenciais do registry Nexus
#   DOCKER_REPO_CERT           — CA cert do Nexus (PEM)
#   GH_PAT                     — token com push em Zing-Developers/helm-charts
#
# Nexus path produzido: docker-repo.zingaistudio.com/<repo-name>/<env>:<tag>
# <env> é o nome do branch sem o prefixo "cloud-" (cloud-dev -> dev, cloud-qa -> qa, ...)
# <tag> é o timestamp UTC do build, formato YYYYMMDD-HHMMSS.
#
# No fim, atualiza automaticamente
#   Zing-Developers/helm-charts:<HELM_VALUES_FILE (com {env} substituído)>
# fazendo `.components.<HELM_CHART_COMPONENT>.tag = "<tag>"` e faz push para main.
#
# --------------------------------------------------------------------------
# HELM_VALUES_FILE — dois formatos de chart existem no helm-charts, e este
# template serve os dois. É SEMPRE o path completo até ao values.yaml a
# editar, relativo à raiz do helm-charts; usa o token literal "{env}" onde
# quiseres que entre o nome do ambiente (derivado do branch).
#
#   Caso A — uma pasta por ambiente, um values.yaml por componente
#            (ex.: policia-nacional/portal-pn/{dev,qa,prod}/<componente>/values.yaml)
#     HELM_VALUES_FILE: "policia-nacional/portal-pn/{env}/cms/values.yaml"
#     HELM_CHART_COMPONENT: "cms"
#     -> branch cloud-dev resolve para
#        policia-nacional/portal-pn/dev/cms/values.yaml
#
#   Caso B — um único values.yaml partilhado por TODOS os componentes,
#            sem pasta por ambiente (ex.: igrp/values/prod-values.yaml,
#            onde `components:` tem uma chave por serviço lá dentro)
#     HELM_VALUES_FILE: "igrp/values/prod-values.yaml"     # sem {env}, path fixo
#     HELM_CHART_COMPONENT: "process-runtime-backend"
#     -> não há substituição a fazer, o path já é o final
#
# Em ambos os casos o `yq` aponta sempre para `.components.<HELM_CHART_COMPONENT>.tag`
# dentro do ficheiro resolvido — a única coisa que muda entre os dois
# formatos de chart é o path do ficheiro, nunca a forma como o componente
# é identificado lá dentro.
# --------------------------------------------------------------------------

name: Build and Push to Nexus

on:
  push:
    branches:
      - 'cloud-*'
    paths-ignore:
      - 'k8s/**'
      - '.gitattributes'

env:
  # ============ FIXO — igual em todos os repos, não mexer ============
  NEXUS_REGISTRY: docker-repo.zingaistudio.com
  REPO_NAME: ${{ github.event.repository.name }}
  BRANCH_NAME: ${{ github.ref_name }}

  # ============ CONFIGURAR POR REPO ============
  # Path completo até ao values.yaml a atualizar, relativo à raiz do
  # helm-charts. Usa o token "{env}" onde deve entrar o ambiente (derivado
  # do branch) — omite-o se o chart tiver um único values.yaml partilhado
  # por todos os ambientes/componentes. Ver explicação completa no topo
  # do ficheiro (secção HELM_VALUES_FILE).
  #   ex. Caso A: "policia-nacional/portal-pn/{env}/cms/values.yaml"
  #   ex. Caso B: "igrp/values/prod-values.yaml"
  HELM_VALUES_FILE: "igrp/values/prod-values.yaml"

  # Chave debaixo de `components:` no values.yaml, cujo `.tag` deve ser
  # atualizado (components.<HELM_CHART_COMPONENT>.tag) — não precisa de
  # bater certo com o nome de uma pasta, é só a chave dentro do YAML.
  HELM_CHART_COMPONENT: "process-runtime-backend"                # ex.: cms, frontend, process-runtime-backend
  # ===============================================

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Add custom CA certificate
        run: |
          echo "${{ secrets.DOCKER_REPO_CERT }}" | sudo tee /etc/ssl/certs/repo-ca.crt
          sudo update-ca-certificates
          sudo mkdir -p /etc/docker/certs.d/${NEXUS_REGISTRY}
          sudo cp /etc/ssl/certs/repo-ca.crt /etc/docker/certs.d/${NEXUS_REGISTRY}/ca.crt
          sudo systemctl restart docker

      - name: Login to Nexus Sonatype
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Compute image tag and Nexus path
        id: vars
        run: |
          TAG=$(date -u +%Y%m%d-%H%M%S)
          IMAGE_ENV=${BRANCH_NAME#cloud-}
          IMAGE="${NEXUS_REGISTRY}/${REPO_NAME}/${IMAGE_ENV}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ steps.vars.outputs.image }}

  update_helm_charts:
    name: Update helm-charts values.yaml
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout helm-charts repo
        uses: actions/checkout@v3
        with:
          repository: Zing-Developers/helm-charts
          token: ${{ secrets.GH_PAT }}
          path: helm-charts

      - name: Setup git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Setup yq
        uses: mikefarah/yq@v4

      - name: Resolve values.yaml path
        run: |
          ENV=${BRANCH_NAME#cloud-}
          # Substitui o token literal "{env}" pelo ambiente resolvido; se o
          # token não existir em HELM_VALUES_FILE (Caso B — ficheiro único
          # partilhado), esta substituição não faz nada e o path fica fixo.
          echo "VALUES_FILE=${HELM_VALUES_FILE//\{env\}/$ENV}" >> "$GITHUB_ENV"

      - name: Update image tag
        run: |
          NEW_TAG="${{ needs.build_and_push.outputs.tag }}"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"
          yq -i ".components.${HELM_CHART_COMPONENT}.tag = \"${NEW_TAG}\"" "helm-charts/${VALUES_FILE}"

      - name: Commit and push
        run: |
          cd helm-charts
          git add "${VALUES_FILE}"
          git commit -m "chore: atualizar imagem ${HELM_CHART_COMPONENT} (${REPO_NAME}) para ${NEW_TAG}" || echo "No changes"
          git push origin main
